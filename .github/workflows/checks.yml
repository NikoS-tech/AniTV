name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project Tests/WatchTests.csproj
      - run: dotnet run --project Tests/UiSmoke/UiSmoke.csproj -- --episode-selection
      - run: dotnet run --project Tests/UiSmoke/UiSmoke.csproj
